name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  waveform-tests:
    name: Waveform Engine Tests (Python ${{{{ python-version }}}})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{{{ python-version }}}}
        uses: actions/setup-python@v5
        with:
          python-version: ${{{{ python-version }}}}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest

      - name: Run waveform engine tests
        run: |
          cd gr-techniquemaker/python
          pytest ../../tests/test_waveform_engine.py -v --tb=short

  headless-smoke:
    name: Headless Engine Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy

      - name: Run headless all-techniques test
        run: |
          python -m apps.engine.headless --all
